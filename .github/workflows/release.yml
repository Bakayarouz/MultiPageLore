name: Auto Build Plugin

on:
  push:
    branches:
      - main # Runs automatically every time you push code to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package
        
      - name: Extract Project Version
        id: version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      # Option A: Upload the .jar as an Artifact (Downloads directly from the Actions tab)
      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiPageLore-Latest
          path: target/MultiPageLore-${{ env.VERSION }}.jar

      # Option B: Maintain a rolling "Latest Dev Build" on the Releases page
      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Auto-Build"
          body: "This is a continuously updated release generated automatically on the latest code push."
          files: target/MultiPageLore-${{ env.VERSION }}.jar
          prerelease: true
